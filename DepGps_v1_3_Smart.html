function dist(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ============================================================
//           PRECISION GPS — Kalman Filter Smoothing
// ============================================================

class KalmanFilter {
    constructor() {
        this.Q = 0.00001; // Process noise
        this.R = 0.01;    // Measurement noise
        this.P = 1;       // Estimation error
        this.X = null;    // Value
        this.K = 0;       // Kalman gain
    }
    
    filter(measurement) {
        if (this.X === null) {
            this.X = measurement;
            return measurement;
        }
        
        // Prediction
        this.P = this.P + this.Q;
        
        // Update
        this.K = this.P / (this.P + this.R);
        this.X = this.X + this.K * (measurement - this.X);
        this.P = (1 - this.K) * this.P;
        
        return this.X;
    }
    
    reset() {
        this.X = null;
        this.P = 1;
    }
}

const kalmanLat = new KalmanFilter();
const kalmanLon = new KalmanFilter();
const kalmanHeading = new KalmanFilter();

// Simple moving average for additional smoothing
function smoothPosition(lat, lon, heading) {
    const positions = S.gps.positions;
    
    // Add new position
    positions.push({ lat, lon, heading, time: Date.now() });
    
    // Keep only last 5 positions (last 5 seconds approx)
    if (positions.length > 5) {
        positions.shift();
    }
    
    // Calculate weighted average (more recent = more weight)
    let totalWeight = 0;
    let smoothLat = 0;
    let smoothLon = 0;
    let smoothHeading = 0;
    
    positions.forEach((pos, i) => {
        const weight = i + 1; // More recent positions have higher weight
        smoothLat += pos.lat * weight;
        smoothLon += pos.lon * weight;
        smoothHeading += pos.heading * weight;
        totalWeight += weight;
    });
    
    return {
        lat: smoothLat / totalWeight,
        lon: smoothLon / totalWeight,
        heading: smoothHeading / totalWeight
    };
}

// Determine GPS signal quality
function getSignalQuality(accuracy) {
    if (accuracy <= 5) return { level: 'excellent', text: t('gps_signal_good'), color: '#00ff00' };
    if (accuracy <= 15) return { level: 'good', text: t('gps_signal_good'), color: '#80ff00' };
    if (accuracy <= 30) return { level: 'fair', text: t('gps_accuracy') + ': ' + Math.round(accuracy) + t('meters'), color: '#ffff00' };
    if (accuracy <= 100) return { level: 'weak', text: t('gps_signal_weak'), color: '#ff8000' };
    return { level: 'poor', text: t('gps_signal_weak'), color: '#ff0000' };
}

// ============================================================
//                DYNAMIC WEATHER SYSTEM
// ============================================================

async function fetchWeather(lat, lon) {
    const url = `${CFG.WEATHER_URL}?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,apparent_temperature&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3`;
    
    try {
        document.getElementById('weatherStatus').style.display = 'block';
        const response = await fetch(url);
        const data = await response.json();
        
        if (data && data.current) {
            S.weather.data = data;
            S.weather.lastUpdate = Date.now();
            S.weather.currentLat = lat;
            S.weather.currentLon = lon;
            updateWeatherWidget(data);
        }
    } catch (error) {
        console.error('Weather fetch error:', error);
    } finally {
        document.getElementById('weatherStatus').style.display = 'none';
    }
}

function updateWeatherWidget(data) {
    if (!data || !data.current) return;
    
    const c = data.current;
    const code = c.weather_code || 0;
    const wData = WEATHER_CODES[code] || ['🌡️', {'ru': '', 'az': ''}];
    
    document.getElementById('weatherEmoji').textContent = wData[0];
    document.getElementById('weatherTemp').textContent = c.temperature_2m + '°C';
}

function updateForecastPanel() {
    const data = S.weather.data;
    if (!data || !data.current) return;
    
    const c = data.current;
    const code = c.weather_code || 0;
    const wData = WEATHER_CODES[code] || ['🌡️', {'ru': '', 'az': ''}];
    
    document.getElementById('currentEmoji').textContent = wData[0];
    document.getElementById('currentTemp').textContent = c.temperature_2m + '°C';
    document.getElementById('currentDesc').textContent = wData[1][S.lang] || '';
    document.getElementById('currentHumidity').textContent = '💧 ' + c.relative_humidity_2m + '%';
    document.getElementById('currentWind').textContent = '💨 ' + c.wind_speed_10m + ' km/h';
    document.getElementById('currentFeels').textContent = '🌡️ ' + c.apparent_temperature + '°C';
    
    // 3 day forecast
    if (data.daily) {
        const days = [t('weather_today'), t('weather_tomorrow'), t('weather_after')];
        let html = '';
        
        for (let i = 0; i < 3; i++) {
            const dayCode = data.daily.weather_code[i] || 0;
            const dayData = WEATHER_CODES[dayCode] || ['🌡️', {}];
            const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
            const minTemp = Math.round(data.daily.temperature_2m_min[i]);
            
            html += `
                <div class="forecast-day">
                    <div class="forecast-day-title">${days[i]}</div>
                    <div class="forecast-day-icon">${dayData[0]}</div>
                    <div class="forecast-day-temp">${maxTemp}°</div>
                    <div class="forecast-day-range">${minTemp}°</div>
                </div>
            `;
        }
        
        document.getElementById('forecast3Days').innerHTML = html;
    }
}

window.toggleWeatherPanel = function() {
    updateForecastPanel();
    document.getElementById('weatherPanelTitle').innerHTML = '🌤️ ' + t('weather_forecast');
    document.getElementById('weatherPanel').style.opacity = '1';
    document.getElementById('weatherPanel').style.visibility = 'visible';
    document.getElementById('weatherPanel').style.transform = 'translate(-50%,-50%) scale(1)';
    document.getElementById('weatherOverlay').style.opacity = '1';
    document.getElementById('weatherOverlay').style.visibility = 'visible';
};

window.closeWeatherPanel = function() {
    document.getElementById('weatherPanel').style.opacity = '0';
    document.getElementById('weatherPanel').style.visibility = 'hidden';
    document.getElementById('weatherPanel').style.transform = 'translate(-50%,-50%) scale(0.9)';
    document.getElementById('weatherOverlay').style.opacity = '0';
    document.getElementById('weatherOverlay').style.visibility = 'hidden';
};

// Map moveend event for dynamic weather
const debouncedWeatherFetch = debounce((lat, lon) => {
    fetchWeather(lat, lon);
}, 1500);

function setupMapEvents() {
    const map = getMap();
    if (!map) {
        setTimeout(setupMapEvents, 500);
        return;
    }
    
    map.on('moveend', () => {
        const center = map.getCenter();
        debouncedWeatherFetch(center.lat, center.lng);
        
        // Update location name (simplified)
        document.getElementById('weatherLocation').textContent = 
            center.lat.toFixed(2) + ', ' + center.lng.toFixed(2);
    });
}

setTimeout(setupMapEvents, 1000);

// Initial weather update
updateWeatherWidget(S.weather.data);

// ============================================================
//              PRECISION GPS SYSTEM
// ============================================================

window.toggleGPS = function() {
    const btn = document.getElementById('gpsBtn');
    const statusBar = document.getElementById('gpsStatusBar');
    
    if (!S.tracking) {
        if (!navigator.geolocation) {
            showToast(t('gps_error'), t('gps_unavailable'), true);
            return;
        }
        
        S.tracking = true;
        btn.classList.add('active');
        statusBar.style.display = 'block';
        
        document.getElementById('gpsStatusText').textContent = t('gps_searching');
        document.getElementById('gpsSignalIcon').style.background = '#ffff00';
        
        // Reset Kalman filters
        kalmanLat.reset();
        kalmanLon.reset();
        kalmanHeading.reset();
        S.gps.positions = [];
        
        // High precision GPS options
        S.watchId = navigator.geolocation.watchPosition(
            onPosition,
            onPosError,
            {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            }
        );
        
        showToast(t('gps_enabled'), '', false);
        speak(t('gps_enabled'));
        
    } else {
        S.tracking = false;
        btn.classList.remove('active');
        statusBar.style.display = 'none';
        
        if (S.watchId) {
            navigator.geolocation.clearWatch(S.watchId);
            S.watchId = null;
        }
        
        // Remove marker and accuracy circle
        const map = getMap();
        if (map) {
            if (S.marker) map.removeLayer(S.marker);
            if (S.accuracyCircle) map.removeLayer(S.accuracyCircle);
        }
        
        showToast(t('gps_disabled'), '', false);
    }
};

function onPosition(pos) {
    const rawLat = pos.coords.latitude;
    const rawLon = pos.coords.longitude;
    const accuracy = pos.coords.accuracy;
    const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0; // km/h
    const heading = pos.coords.heading || S.gps.lastHeading;
    const altitude = pos.coords.altitude;
    
    // Apply Kalman filtering
    const filteredLat = kalmanLat.filter(rawLat);
    const filteredLon = kalmanLon.filter(rawLon);
    const filteredHeading = kalmanHeading.filter(heading || 0);
    
    // Apply smoothing
    const smoothed = smoothPosition(filteredLat, filteredLon, filteredHeading);
    
    // Update GPS state
    S.gps.accuracy = accuracy;
    S.gps.speed = speed;
    S.gps.heading = smoothed.heading;
    S.gps.smoothLat = smoothed.lat;
    S.gps.smoothLon = smoothed.lon;
    
    // Detect movement
    const isMoving = speed > 1; // > 1 km/h
    if (isMoving) {
        S.gps.lastMoveTime = Date.now();
        S.gps.isMoving = true;
        S.gps.lastHeading = smoothed.heading;
    } else if (Date.now() - S.gps.lastMoveTime > 3000) {
        S.gps.isMoving = false;
    }
    
    // Update status UI
    const signal = getSignalQuality(accuracy);
    document.getElementById('gpsSignalIcon').style.background = signal.color;
    document.getElementById('gpsSignalIcon').style.boxShadow = `0 0 10px ${signal.color}`;
    document.getElementById('gpsStatusText').textContent = signal.text;
    
    document.getElementById('gpsAccuracyText').textContent = Math.round(accuracy) + t('meters');
    document.getElementById('gpsSpeedText').textContent = speed.toFixed(1) + ' ' + t('kmh');
    document.getElementById('gpsHeadingText').textContent = Math.round(smoothed.heading) + '°';
    document.getElementById('gpsMovementStatus').textContent = 
        S.gps.isMoving ? '▶️ ' + t('gps_moving') : '⏸️ ' + t('gps_stationary');
    
    // Update stats
    if (S.stats.lastPos) {
        const d = dist(S.stats.lastPos.lat, S.stats.lastPos.lon, smoothed.lat, smoothed.lon);
        if (d > 3 && d < 100) { // Filter GPS noise
            S.stats.distance += d;
        }
    }
    if (speed > S.stats.maxSpeed) S.stats.maxSpeed = speed;
    S.stats.lastPos = { lat: smoothed.lat, lon: smoothed.lon };
    save();
    
    // Update map
    updateMapMarker(smoothed.lat, smoothed.lon, smoothed.heading, accuracy, S.gps.isMoving);
    
    // Check cameras
    checkCameras(smoothed.lat, smoothed.lon, speed);
}

function updateMapMarker(lat, lon, heading, accuracy, isMoving) {
    const map = getMap();
    if (!map) return;
    
    // Remove old marker and circle
    if (S.marker) map.removeLayer(S.marker);
    if (S.accuracyCircle) map.removeLayer(S.accuracyCircle);
    
    // Create accuracy circle (like Google Maps)
    S.accuracyCircle = L.circle([lat, lon], {
        radius: accuracy,
        color: '#00f2ff',
        fillColor: '#00f2ff',
        fillOpacity: 0.15,
        weight: 2,
        opacity: 0.5
    }).addTo(map);
    
    // Determine arrow opacity based on movement
    const arrowOpacity = isMoving ? 1 : 0.4;
    const arrowAnimation = isMoving ? '' : 'animation:arrowFade 2s ease-in-out infinite;';
    
    // Create user marker with rotating arrow
    const markerHTML = `
        <div style="position:relative;width:40px;height:40px;">
            <!-- Accuracy pulse -->
            <div style="
                position:absolute;top:50%;left:50%;
                transform:translate(-50%,-50%);
                width:30px;height:30px;
                background:radial-gradient(circle,rgba(0,242,255,0.6) 0%,transparent 70%);
                border-radius:50%;
                animation:markerPulse 2s ease-in-out infinite;">
            </div>
            
            <!-- Center dot -->
            <div style="
                position:absolute;top:50%;left:50%;
                transform:translate(-50%,-50%);
                width:16px;height:16px;
                background:#00f2ff;
                border:3px solid #fff;
                border-radius:50%;
                box-shadow:0 2px 8px rgba(0,0,0,0.4);">
            </div>
            
            <!-- Direction arrow -->
            <div style="
                position:absolute;top:50%;left:50%;
                transform:translate(-50%,-50%) rotate(${heading}deg);
                opacity:${arrowOpacity};
                ${arrowAnimation}
                transition:transform 0.5s ease-out,opacity 0.5s;">
                <div style="
                    position:absolute;top:-22px;left:50%;
                    transform:translateX(-50%);
                    border-left:8px solid transparent;
                    border-right:8px solid transparent;
                    border-bottom:16px solid #00f2ff;
                    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));">
                </div>
            </div>
        </div>
    `;
    
    S.marker = L.marker([lat, lon], {
        icon: L.divIcon({
            className: 'user-marker',
            html: markerHTML,
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        })
    }).addTo(map);
    
    // Smooth pan to position
    map.setView([lat, lon], Math.max(map.getZoom(), 15), { animate: true, duration: 0.5 });
}

function onPosError(err) {
    const messages = {
        1: t('gps_denied'),
        2: t('gps_unavailable'),
        3: t('gps_timeout')
    };
    
    document.getElementById('gpsStatusText').textContent = messages[err.code] || t('gps_error');
    document.getElementById('gpsSignalIcon').style.background = '#ff0000';
    
    showToast(t('gps_error'), messages[err.code] || '', true);
}

function updateLabels() {
    document.getElementById('searchInput').placeholder = t('search_placeholder');
    document.getElementById('langLabel').textContent = S.lang.toUpperCase();
    document.getElementById('routeBtnText').textContent = t('route');
    document.getElementById('priceTitle').innerHTML = '💰 ' + t('taxi_price');
    document.getElementById('distLabel').textContent = t('distance');
    document.getElementById('timeLabel').textContent = t('time');
    document.getElementById('statsTitle').innerHTML = '🏆 ' + t('stats');
    document.getElementById('statDistLabel').textContent = t('km');
    document.getElementById('statSpeedLabel').textContent = 'Max ' + t('kmh');
    document.getElementById('statCamsLabel').textContent = t('cameras');
    document.getElementById('statRoutesLabel').textContent = t('routes_built');
    document.getElementById('resetStatsBtn').innerHTML = '🗑️ ' + t('reset_stats');
}

// Search
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let currentFilter = 'all';

searchInput.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    if (query.length < 2) {
        searchResults.style.display = 'none';
        return;
    }
    
    let filtered = PLACES.filter(p => {
        const matchesQuery = p.name.toLowerCase().includes(query) ||
            p.label.toLowerCase().includes(query) ||
            (p.brand && p.brand.toLowerCase().includes(query));
        const matchesFilter = currentFilter === 'all' || p.type === currentFilter;
        return matchesQuery && matchesFilter;
    }).slice(0, 20);
    
    if (filtered.length === 0) {
        searchResults.innerHTML = `<div style="padding:24px;text-align:center;color:#6b7280;">${t('no_results')}</div>`;
    } else {
        searchResults.innerHTML = filtered.map(p => `
            <div class="search-item" onclick="selectPlace('${p.id}')">
                <span style="font-size:26px;">${p.emoji}</span>
                <div><div style="color:#fff;font-size:15px;font-weight:600;">${p.name}</div>
                <div style="color:#6b7280;font-size:12px;">${LANG[p.type]?.[S.lang] || p.label}</div></div>
            </div>
        `).join('');
    }
    searchResults.style.display = 'block';
});

document.addEventListener('click', (e) => {
    if (!e.target.closest('#searchContainer')) searchResults.style.display = 'none';
});

window.toggleFilters = function() {
    const pills = document.getElementById('filterPills');
    pills.style.display = pills.style.display === 'none' ? 'block' : 'none';
};

window.setFilter = function(type) {
    currentFilter = type;
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.filter === type));
    if (searchInput.value.length >= 2) searchInput.dispatchEvent(new Event('input'));
};

window.selectPlace = function(id) {
    const place = PLACES.find(p => p.id === id);
    if (!place) return;
    
    S.selectedPlace = place;
    searchResults.style.display = 'none';
    searchInput.value = '';
    
    document.getElementById('placeEmoji').textContent = place.emoji;
    document.getElementById('placeName').textContent = place.name;
    document.getElementById('placeType').textContent = LANG[place.type]?.[S.lang] || place.label;
    document.getElementById('placeAddress').textContent = place.city || '';
    
    let tags = [];
    if (place.is24h) tags.push(`⏰ ${t('open_24h')}`);
    if (place.brand) tags.push(`🏷️ ${place.brand}`);
    document.getElementById('placeTags').innerHTML = tags.map(tag => `<span class="tag">${tag}</span>`).join('');
    
    const map = getMap();
    if (map) map.flyTo([place.lat, place.lon], 16, { duration: 1 });
    
    openBottomSheet();
    calcRoutePreview(place);
};

function calcRoutePreview(place) {
    let startLat = S.gps.smoothLat || S.stats.lastPos?.lat || CFG.BAKU[0];
    let startLon = S.gps.smoothLon || S.stats.lastPos?.lon || CFG.BAKU[1];
    
    fetch(`https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${place.lon},${place.lat}?overview=false`)
        .then(r => r.json())
        .then(d => {
            if (d.code !== 'Ok') return;
            const km = (d.routes[0].distance / 1000).toFixed(1);
            const mins = Math.round(d.routes[0].duration / 60);
            
            document.getElementById('routeDistance').textContent = km + ' ' + t('km');
            document.getElementById('routeTime').textContent = mins + ' ' + t('min');
            document.getElementById('routeInfo').style.display = 'block';
            
            const base = CFG.TAXI_START + km * CFG.TAXI_KM;
            document.getElementById('pricesList').innerHTML = `
                <div class="price-item"><span>🚕 ${t('economy')}</span><b>${(base*0.8).toFixed(2)}₼</b></div>
                <div class="price-item"><span>🚖 ${t('standard')}</span><b>${base.toFixed(2)}₼</b></div>
                <div class="price-item"><span>🚙 ${t('comfort')}</span><b>${(base*1.4).toFixed(2)}₼</b></div>
                <div class="price-item"><span>🚌 ${t('bus')}</span><b>${CFG.BUS}₼</b></div>
            `;
            document.getElementById('taxiPrices').style.display = 'block';
        });
}

window.openBottomSheet = () => document.getElementById('bottomSheet').style.transform = 'translateY(0)';
window.closeBottomSheet = () => {
    document.getElementById('bottomSheet').style.transform = 'translateY(100%)';
    document.getElementById('routeInfo').style.display = 'none';
    document.getElementById('taxiPrices').style.display = 'none';
};

window.buildRouteToSelected = function() {
    if (!S.selectedPlace) return;
    buildRoute(S.selectedPlace.lat, S.selectedPlace.lon);
    closeBottomSheet();
};

window.buildRoute = function(endLat, endLon) {
    let startLat = S.gps.smoothLat || S.stats.lastPos?.lat || CFG.BAKU[0];
    let startLon = S.gps.smoothLon || S.stats.lastPos?.lon || CFG.BAKU[1];
    
    showToast(t('building_route'), '', false);
    
    fetch(`https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${endLon},${endLat}?overview=full&geometries=geojson`)
        .then(r => r.json())
        .then(d => {
            if (d.code !== 'Ok') { showToast(t('route_error'), '', true); return; }
            const map = getMap();
            if (!map) return;
            
            if (S.routeLine) map.removeLayer(S.routeLine);
            if (S.endMarker) map.removeLayer(S.endMarker);
            
            const coords = d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            S.routeLine = L.polyline(coords, { color:'#00f2ff', weight:6, opacity:0.9 }).addTo(map);
            S.endMarker = L.marker([endLat, endLon], {
                icon: L.divIcon({ html:'<div style="font-size:32px;">🏁</div>', iconSize:[36,36], iconAnchor:[18,18] })
            }).addTo(map);
            
            map.fitBounds(S.routeLine.getBounds(), { padding:[60,60] });
            S.stats.routes++; save();
            speak(t('route_ready'));
        });
};

function showToast(title, body, isAlert) {
    document.getElementById('alertTitle').textContent = title;
    document.getElementById('alertBody').textContent = body;
    document.getElementById('alertToast').style.top = '20px';
    if (isAlert && 'vibrate' in navigator) navigator.vibrate([150,80,150]);
    setTimeout(() => document.getElementById('alertToast').style.top = '-120px', 4000);
}

window.toggleAlerts = function() {
    S.alerts = !S.alerts;
    document.getElementById('alertsBtn').classList.toggle('active', S.alerts);
    document.getElementById('alertsBtn').querySelector('span').textContent = S.alerts ? '🔔' : '🔕';
    showToast(S.alerts ? t('alerts_on') : t('alerts_off'), '', false);
    if (S.alerts) speak(t('alerts_on'));
};

function checkCameras(lat, lon, spd) {
    if (!S.alerts) return;
    CAMERAS.forEach(c => {
        const d = dist(lat, lon, c.lat, c.lon);
        const id = c.lat.toFixed(4) + c.lon.toFixed(4);
        if (d < CFG.CAMERA_DIST && !S.alertedCams.has(id)) {
            S.alertedCams.add(id);
            S.stats.cameras++; save();
            showToast(t('camera_alert'), Math.round(d) + t('meters') + '. ' + t('slow_down'), true);
            speak(t('camera_alert'));
        }
        if (d > CFG.CAMERA_DIST * 3) S.alertedCams.delete(id);
    });
}

window.toggleVoice = function() {
    S.voice = !S.voice;
    document.getElementById('voiceBtn').classList.toggle('active', S.voice);
    document.getElementById('voiceBtn').querySelector('span').textContent = S.voice ? '🔊' : '🔇';
    if (S.voice) speak(t('voice_on'));
};

function speak(text) {
    if (!S.voice || !speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = S.lang === 'az' ? 'az-AZ' : 'ru-RU';
    speechSynthesis.speak(u);
}

window.toggleLang = function() {
    S.lang = S.lang === 'ru' ? 'az' : 'ru';
    localStorage.setItem('depgps_lang', S.lang);
    updateLabels();
    showToast(S.lang === 'ru' ? 'Русский' : 'Azərbaycan', '', false);
};

window.toggleTheme = function() {
    S.theme = S.theme === 'dark' ? 'oled' : 'dark';
    localStorage.setItem('depgps_theme', S.theme);
    document.body.classList.toggle('oled-theme', S.theme === 'oled');
    document.getElementById('themeIcon').textContent = S.theme === 'oled' ? '☀️' : '🌙';
};

if (S.theme === 'oled') document.body.classList.add('oled-theme');

window.openStats = function() {
    document.getElementById('statDist').textContent = (S.stats.distance / 1000).toFixed(1);
    document.getElementById('statSpeed').textContent = S.stats.maxSpeed.toFixed(0);
    document.getElementById('statCams').textContent = S.stats.cameras;
    document.getElementById('statRoutes').textContent = S.stats.routes;
    document.getElementById('statsPanel').style.cssText = 'opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);';
    document.getElementById('statsOverlay').style.cssText = 'opacity:1;visibility:visible;';
};

window.closeStats = function() {
    document.getElementById('statsPanel').style.cssText = 'opacity:0;visibility:hidden;transform:translate(-50%,-50%) scale(0.9);';
    document.getElementById('statsOverlay').style.cssText = 'opacity:0;visibility:hidden;';
};

window.resetStats = function() {
    if (confirm(t('reset_confirm'))) {
        S.stats = { distance:0, maxSpeed:0, cameras:0, routes:0, lastPos:null };
        save(); openStats();
    }
};

window.addEventListener('offline', () => showToast(t('offline'), '', true));
window.addEventListener('online', () => showToast(t('online'), '', false));

updateLabels();

console.log('✅ DepGps v1.3 Smart loaded!');
console.log('📊 Places:', PLACES.length, '| Cameras:', CAMERAS.length);

}, 100);
